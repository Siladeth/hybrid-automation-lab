---
- name: Sécurisation Réseau de PostgreSQL
  hosts: dbservers
  become: yes
  tasks:
    - name: Forcer PostgreSQL à écouter sur son IP privée (et non partout)
      lineinfile:
        path: /etc/postgresql/15/main/postgresql.conf
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '192.168.56.12, localhost'"
      notify: Redémarrer PostgreSQL

    - name: Autoriser UNIQUEMENT le serveur Web à s'y connecter
      lineinfile:
        path: /etc/postgresql/15/main/pg_hba.conf
        line: "host    all             all             192.168.56.11/32        scram-sha-256"
        insertafter: EOF
      notify: Redémarrer PostgreSQL

  handlers:
    - name: Redémarrer PostgreSQL
      service:
        name: postgresql
        state: restarted
